name: trucvb
description: TrucVB mobile application.
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ">=3.5.4 <4.0.0"

dependencies:
  async: 2.13.0
  auto_route: ^10.1.0+1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartx: 1.2.0
  domain:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^19.3.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: 2.2.0
  get_it: ^8.0.3
  image_picker: ^1.1.2
  infinite_scroll_pagination: ^5.1.0
  initializer:
  injectable: ^2.6.0
  resources:
  rxdart: 0.28.0
  shared:
  tuple: 2.0.2

dev_dependencies:
  auto_route_generator: ^10.2.3
  bloc_test: ^10.0.0
  build_runner: ^2.5.4
  custom_lint: ^0.8.1
  flutter_gen_runner: ^5.11.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  freezed_annotation: ^3.0.0
  injectable_generator: ^2.9.0
  logging: ^1.3.0
  mocktail: ^1.0.4
  nals_lints:

# Config generate when build
flutter_gen:
  output: lib/resource/generated
  # line_length: 160

  integrations:
    flutter_svg: true
    # flare_flutter: true

  assets:
    enabled: true

  fonts:
    enabled: true
  # colors:
  #   enabled: true
  #   inputs:
  #     - assets/color/colors.xml
flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/images/
  fonts:
    - family: SegoeUI
      fonts:
        - asset: assets/fonts/segoeuil.ttf
          weight: 300

        - asset: assets/fonts/segoeuisl.ttf
          weight: 350

        - asset: assets/fonts/segoeui.ttf
          weight: 400

        - asset: assets/fonts/seguisb.ttf
          weight: 600

        - asset: assets/fonts/segoeuib.ttf
          weight: 700

        - asset: assets/fonts/seguibl.ttf
          weight: 900


        - asset: assets/fonts/seguili.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/seguisli.ttf
          weight: 350
          style: italic

        - asset: assets/fonts/segoeuii.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/seguisbi.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/segoeuiz.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/seguibli.ttf
          weight: 900
          style: italic
